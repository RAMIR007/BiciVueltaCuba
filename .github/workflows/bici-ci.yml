name: Bici Vuelta Cuba CI

on:
  push:
    branches:
      - maintenance/bici-vuelta-cuba-security
    paths-ignore:
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: bici-vuelta-cuba-security-ci
  cancel-in-progress: false

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply compatible dependency security updates
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: apply transitive dependency security fixes"
            git push
          fi

      - name: Install from lockfile
        run: npm ci

      - name: Summarize dependency vulnerabilities
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const audit = require('/tmp/npm-audit.json');
          const entries = Object.entries(audit.vulnerabilities || {});
          console.log('Vulnerable dependency count:', entries.length);
          for (const [name, item] of entries) {
            console.log(`- ${name}: ${item.severity}; direct=${item.isDirect}; range=${item.range}`);
            for (const advisory of item.via || []) {
              if (typeof advisory === 'object') {
                console.log(`  advisory: ${advisory.title} | ${advisory.url}`);
              }
            }
            if (item.fixAvailable) {
              console.log('  fixAvailable:', JSON.stringify(item.fixAvailable));
            }
          }
          NODE

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
